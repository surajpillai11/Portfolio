<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0a0a0f" />
  <rect width="96" height="96" x="2" y="2" rx="22" fill="none" stroke="url(#cyber)" stroke-width="2" opacity="0.6" />
  <text x="50" y="65" font-family="'Space Grotesk', system-ui, sans-serif" font-size="46" font-weight="900" fill="url(#cyber)" text-anchor="middle" filter="url(#glow)">SP</text>
</svg>